    if(!el)return;

      if(typeof el.showPicker==="function"){ el.showPicker(); return true; }
    }catch(e){}
    try{ el.focus(); }catch(e){}
    return false;
  }
  function bind(){
    ["pd","px"].forEach(function(id){
      const el=document.getElementById(id);
      if(!el||el.dataset.datePicker261)return;
      el.dataset.datePicker261="1";
      el.addEventListener("click",function(e){openPicker(el)},false);
      el.addEventListener("focus",function(){},false);
    });
  }
  const mo=new MutationObserver(bind);

  document.addEventListener("DOMContentLoaded",bind);
  setTimeout(bind,50);

})();

<script>
'use strict';
const KEY='glass_notes_v2';
const DEF={notes:[],tasks:[],payments:[],settings:{accent:'#66e3ff',bg:'',name:'señor',voice:true,notifications:false,notifyPayments:true,notifyTasks:true,notifyOverdue:true},messages:[]};
function safe(v){try{return JSON.parse(v)}catch(e){return null}}
function norm(x){x=x&&typeof x==='object'?x:{};return{notes:Array.isArray(x.notes)?x.notes.filter(v=>v&&typeof v==='object'):[],tasks:Array.isArray(x.tasks)?x.tasks.filter(v=>v&&typeof v==='object'):[],payments:Array.isArray(x.payments)?x.payments.filter(v=>v&&typeof v==='object'):[],settings:{...DEF.settings,...(x.settings||{})},messages:Array.isArray(x.messages)?x.messages.filter(v=>v&&typeof v==='object'):[]}}
let S=norm(safe(localStorage.getItem(KEY)));
function migratePayments(){
 if(!Array.isArray(S.payments))S.payments=[];
 S.payments=S.payments.filter(x=>x&&typeof x==='object').map(x=>({
  ...x,
  id:String(x.id||id()),
  title:String(x.title||'Pago'),
  amount:Number.isFinite(Number(x.amount))?Number(x.amount):0,
  note:String(x.note||''),
  date:String(x.date||''),
  time:String(x.time||''),
  due:String(x.due||''),
  status:x.status==='paid'?'paid':'pending',
  recurrence:(x.recurrence&&typeof x.recurrence==='object')?{
    enabled:!!x.recurrence.enabled,
    frequency:['weekly','monthly','annual'].includes(x.recurrence.frequency)?x.recurrence.frequency:'monthly',
    auto:!!x.recurrence.auto,
    nextDate:String(x.recurrence.nextDate||'')
  }:{enabled:false,frequency:'monthly',auto:false,nextDate:''}
 }));
}
migratePayments();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('No se pudo guardar. Libera espacio del navegador e inténtalo de nuevo.')}}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){location.hash=p;render()}
function pg(){return location.hash.slice(1)||'home'}
function render(){document.documentElement.style.setProperty('--user-bg',S.settings.bg?`url("${S.settings.bg}")`:'none');
 document.documentElement.style.setProperty('--a',S.settings.accent||'#66e3ff');
 if(S.settings.bg)document.body.style.backgroundImage=`url("${S.settings.bg}")`;
 const h=new Date().getHours();document.getElementById('greet').textContent=(h<12?'Buenos días, ':h<19?'Buenas tardes, ':'Buenas noches, ')+(S.settings.name||'señor')+'.';
 const p=pg();document.body.classList.toggle('home-mode',p==='home');if(p==='tasks')tasks();else if(p==='payments')payments();else if(p==='jarvis')jarvis();else if(p==='home')homeDashboard();else notes(false);
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));const b=document.getElementById('n-'+(p==='home'?'notes':p));if(b)b.classList.add('active')
}
function homeDashboard(){
 const now=new Date();
 const pending=S.tasks.filter(x=>!x.done), done=S.tasks.filter(x=>x.done);
 const activePayments=S.payments.filter(x=>x.status!=='paid');
 const overdue=activePayments.filter(x=>paymentKind(x)==='overdue');
 const dueToday=activePayments.filter(x=>paymentKind(x)==='today');
 const soon=activePayments.filter(x=>paymentKind(x)==='soon');
 const pendingAmount=activePayments.reduce((a,x)=>a+(Number(x.amount)||0),0);
 const recentNotes=S.notes.slice().sort((a,b)=>(b.updated||b.created||0)-(a.updated||a.created||0)).slice(0,3);
 const nextPayments=activePayments.slice().sort((a,b)=>paymentSort(a)-paymentSort(b)).slice(0,4);
 const dateLabel=now.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const greet=now.getHours()<12?'Buenos días,':now.getHours()<19?'Buenas tardes,':'Buenas noches,';
 const firstTask=pending.slice(0,5);
 const taskRows=firstTask.length?firstTask.map((t,i)=>`<div class="v31-row"><div class="v31-check"></div><div class="v31-rmain"><div class="v31-rtitle">${esc(t.title||'Pendiente')}</div><div class="v31-rsub">${esc(t.detail||'Pendiente')}</div></div>${i===0?'<span class="v31-badge">Alta</span>':''}<span class="v31-rsub">${t.time?esc(t.time):''}</span></div>`).join(''):'<div class="v31-empty">✨ Todo al día. No tienes pendientes.</div>';
 const payRows=nextPayments.length?nextPayments.map(p=>`<div class="v31-row"><div class="v31-rmain"><div class="v31-rtitle">${esc(p.title||'Pago')}</div><div class="v31-rsub">${paymentKind(p)==='overdue'?'Vencido':paymentKind(p)==='today'?'Hoy':paymentKind(p)==='soon'?'Próximo':'Pendiente'} · ${esc(p.due||p.date||'Sin fecha')}</div></div><div class="v31-price">$${(Number(p.amount)||0).toLocaleString('es-MX',{maximumFractionDigits:0})}</div></div>`).join(''):'<div class="v31-empty">No hay pagos pendientes.</div>';
 const noteCards=recentNotes.length?recentNotes.map(n=>`<div class="v31-note" onclick="note('${esc(n.id)}')"><div class="ni">📄</div><b>${esc(n.title||'Sin título')}</b><span>${esc(n.updatedLabel||'Reciente')}</span></div>`).join(''):'<div class="v31-empty">No hay notas recientes.</div>';
 const alertCount=overdue.length||dueToday.length||activePayments.length;
 const alertLabel=overdue.length?'Pagos vencidos':dueToday.length?'Vencen hoy':'Pagos pendientes';
 const alertClass=overdue.length?'red':dueToday.length?'orange':'blue';
 document.getElementById('app').innerHTML=`<div class="v31-home">
  <section class="v31-hero">
   <div class="v31-character"></div>
   <div class="v31-copy"><div class="v31-kicker">GLASS NOTES // PERSONAL SPACE</div><div class="v31-greet">${greet}<br><span>${esc(S.settings.name||'señor')}.</span></div><div class="v31-date">${esc(dateLabel)}</div><div class="v31-status"><i></i>Sistema activo · todo bajo control</div></div>
  </section>
  <section class="v31-stats">
   <div class="v31-stat ${alertClass}"><div class="s-icon">${overdue.length?'💳':'💳'}</div><div class="s-num">${alertCount}</div><div class="s-label">${alertLabel}</div><div class="s-sub">$${overdue.length?overdue.reduce((a,x)=>a+(Number(x.amount)||0),0).toLocaleString('es-MX',{maximumFractionDigits:0}):''}</div></div>
   <div class="v31-stat orange"><div class="s-icon">◷</div><div class="s-num">${soon.length}</div><div class="s-label">Pagos próximos</div><div class="s-sub">$${soon.reduce((a,x)=>a+(Number(x.amount)||0),0).toLocaleString('es-MX',{maximumFractionDigits:0})}</div></div>
   <div class="v31-stat blue"><div class="s-icon">✓</div><div class="s-num">${pending.length}</div><div class="s-label">Pendientes hoy</div><div class="s-sub">${done.length} completados</div></div>
   <div class="v31-stat violet"><div class="s-icon">▤</div><div class="s-num">${S.notes.length}</div><div class="s-label">Notas</div><div class="s-sub">${recentNotes.length} recientes</div></div>

 }

 else if(m=clean.match(/^(?:registra|crea|agrega|añade)\s+(?:un\s+)?pago\s+(.+?)\s+(?:de\s+)?\$?([0-9]+(?:[.,][0-9]{1,2})?)(?:\s+(.*))?$/i)){

 }
 else if(/(?:abre|abrir|muestra|mostrar|ve a|ir a)\s+(?:mis\s+)?(?:notas|nota)/i.test(clean)){

   reply='Abriendo tus pagos.';navigated=true;go('payments');
 }
 else if(/(?:abre|abrir|muestra|mostrar|ve a|ir a)\s+(?:los\s+)?ajustes|configuraci[oó]n/i.test(clean)){

 }
 else if(/(?:hola|buenos|buenas|qui[eé]n eres|qu[eé]\s+puedes)/i.test(clean)){

/* V2.0.4: gestos táctiles en Notas, Listas y Pagos.
   Izquierda -> derecha = modificar
   Derecha -> izquierda = eliminar */
(function(){
 let sx=0,sy=0,dx=0,dy=0,card=null,moved=false;
 function getId(el){
  if(!el)return '';
  if(el.dataset.id)return el.dataset.id;
  const html=el.innerHTML;
  const m=html.match(/onclick="[^"]*'([^']+)'/);
  return m?m[1]:'';
 }
 document.addEventListener('touchstart',function(e){
  const t=e.changedTouches[0];
  const c=e.target.closest('.note,.list,.payment');
  if(!c)return;
  sx=t.clientX;sy=t.clientY;dx=dy=0;card=c;moved=false;
 },{passive:true});
 document.addEventListener('touchmove',function(e){
  if(!card)return;
  const t=e.changedTouches[0];
  dx=t.clientX-sx;dy=t.clientY-sy;
  if(Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.15)moved=true;
 },{passive:true});
 document.addEventListener('touchend',function(){
  if(!card||!moved){card=null;return}
  const c=card,id=getId(c);
  card=null;
  if(!id)return;
  if(dx<=-80){
   if(confirm('¿Eliminar este elemento?')) {
    if(c.classList.contains('note') && typeof delNote==='function')delNote(id);
    else if(c.classList.contains('list') && typeof delList==='function')delList(id);
    else if(c.classList.contains('payment') && typeof delPayment==='function')delPayment(id);
   }
  }else if(dx>=80){
   if(c.classList.contains('note') && typeof note==='function')note(id);
   else if(c.classList.contains('list') && typeof list==='function')list(id);
   else if(c.classList.contains('payment') && typeof payment==='function')payment(id);
  }
 },{passive:true});
})();

  wrap.addEventListener("touchend",()=>{if(!drag)return;drag=false;card.style.transition="transform .18s ease";const id=wrap.dataset.id;if(dx>75){card.style.transform="translateX(110px)";setTimeout(()=>{reset();if(card.classList.contains("note"))note(id);else if(card.classList.contains("task"))task(id);else payment(id)},140)}else if(dx<-75){card.style.transform="translateX(-110px)";setTimeout(()=>{reset();if(confirm("¿Eliminar este elemento?")){if(card.classList.contains("note"))delNote(id);else if(card.classList.contains("task"))delTask(id);else delPayment(id)}},140)}else reset()},{passive:true});
  wrap.addEventListener("touchcancel",()=>{drag=false;card.style.transition="transform .18s ease";reset()},{passive:true});
 });

<script id="search-pro-v222-js">
(function(){
  const input = document.getElementById('globalSearchInput');
  const filter = document.getElementById('globalSearchFilter');
  const results = document.getElementById('globalSearchResults');
  const clear = document.getElementById('searchClear');
  const count = document.getElementById('searchCount');
  if(!input || !results) return;

  function state(){
    try { return JSON.parse(localStorage.getItem('glass_notes_v2') || '{}'); }
    catch(e){ return {}; }
  }

  function text(v){ return String(v ?? ''); }
  function lower(v){ return text(v).toLowerCase(); }

  function runSearch(){
    const q = lower(input.value).trim();
    const f = filter ? filter.value : 'all';
    results.innerHTML = '';
    if(!q){
      count.textContent = '';
      return;
    }

    const S = state();
    const items = [];

    (S.notes || []).forEach(n=>{
      if(f!=='all' && f!=='note') return;
      const hay = lower(text(n.title)+' '+text(n.content)+' '+text(n.text));
      if(hay.includes(q)) items.push({type:'note',icon:'📝',title:text(n.title||'Nota'),body:text(n.content||n.text||''),id:n.id});
    });

    (S.tasks || []).forEach(t=>{
      if(f!=='all' && f!=='task') return;
      const hay = lower(text(t.title)+' '+text(t.text)+' '+text(t.description));
      if(hay.includes(q)) items.push({type:'task',icon:'✅',title:text(t.title||t.text||'Lista'),body:text(t.description||''),id:t.id});
    });

    (S.payments || []).forEach(p=>{
      if(f!=='all' && f!=='payment') return;
      const hay = lower(text(p.title)+' '+text(p.concept)+' '+text(p.description)+' '+text(p.amount));
      if(hay.includes(q)) items.push({type:'payment',icon:'💳',title:text(p.title||p.concept||'Pago'),body:text(p.amount||p.description||''),id:p.id});
    });

    count.textContent = items.length + (items.length===1 ? ' resultado' : ' resultados');

    if(!items.length){
      results.innerHTML = '<div class="search-empty">No encontré coincidencias.</div>';
      return;
    }

    items.slice(0,50).forEach(item=>{
      const el=document.createElement('div');
      el.className='search-result';
      el.innerHTML='<div class="sr-title">'+item.icon+' '+escapeHtml(item.title)+'</div>'
        +'<div class="sr-meta">'+escapeHtml(item.body).slice(0,140)+(item.body.length>140?'…':'')+' · Toca para abrir →</div>';
      el.addEventListener('click',()=>{
        try{
          if(item.type==='note'){
            if(typeof openNote==='function') openNote(item.id);
            else if(typeof note==='function') note(item.id);
          }else if(item.type==='task'){
            if(typeof openTask==='function') openTask(item.id);
            else if(typeof editTask==='function') editTask(item.id);
          }else if(item.type==='payment'){
            if(typeof openPayment==='function') openPayment(item.id);
            else if(typeof payment==='function') payment(item.id);
          }
        }catch(e){ console.warn('Glass Notes search open:',e); }
      });
      results.appendChild(el);
    });
  }

  function escapeHtml(v){
    return text(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  input.addEventListener('input',runSearch);
  if(filter) filter.addEventListener('change',runSearch);
  if(clear) clear.addEventListener('click',()=>{
    input.value=''; if(filter) filter.value='all'; runSearch(); input.focus();
  });
})();
</script>

      if(!recurring) return;
      const b=document.createElement('span');
      b.className=TAG;
      b.textContent=t.includes('semanal')?'↻ SEMANAL':t.includes('anual')?'↻ ANUAL':'↻ MENSUAL';
      const anchor=card.querySelector('.status,.badge,.card-header,h3,h4,.title')||card.firstElementChild;
      if(anchor) anchor.appendChild(b); else card.insertBefore(b,card.firstChild);
    });
  }
  const obs=new MutationObserver(enhance);
  obs.observe(document.body,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',enhance);
  setTimeout(enhance,300);
})();
</script>


<script id="payments-center-v25-js">
(function(){
  function dateOnly(v){
    const m=String(v||"").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(!m)return null;
    const d=new Date(+m[1],+m[2]-1,+m[3]);d.setHours(0,0,0,0);return d;
  }
  function today(){const d=new Date();d.setHours(0,0,0,0);return d}
  function kind(p){
    if(!p||p.status==="paid"||p.paid===true||p.completed===true)return "paid";
    const d=dateOnly(p.due||p.date);if(!d)return "none";
    const diff=Math.round((d-today())/86400000);
    if(diff<0)return "overdue";if(diff===0)return "today";if(diff<=7)return "soon";return "future";
  }
  function money(n){return (Number(n)||0).toLocaleString("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:2})}
  function render(){
    const host=document.getElementById("paymentsCenterV25");
    if(!host||!window.S)return;
    const ps=Array.isArray(S.payments)?S.payments:[];
    const overdue=ps.filter(p=>kind(p)==="overdue");
    const todayN=ps.filter(p=>kind(p)==="today");
    const soon=ps.filter(p=>kind(p)==="soon");
    const pending=ps.filter(p=>["overdue","today","soon","future"].includes(kind(p)));
    const overdueAmt=overdue.reduce((a,p)=>a+(Number(p.amount)||0),0);
    const pendingAmt=pending.reduce((a,p)=>a+(Number(p.amount)||0),0);
    host.innerHTML='<div class="pc-head"><div><div class="pc-title">💳 Centro de pagos</div><div class="pc-sub">Lo importante para que no se te pase.</div></div></div>'+
      '<div class="pc-grid">'+
      '<div class="pc-item"><div class="pc-num">'+overdue.length+'</div><div class="pc-label">🔴 Vencidos</div></div>'+
      '<div class="pc-item"><div class="pc-num">'+todayN.length+'</div><div class="pc-label">⚠️ Hoy</div></div>'+
      '<div class="pc-item"><div class="pc-num">'+soon.length+'</div><div class="pc-label">📅 Próximos 7 días</div></div>'+
      '<div class="pc-item"><div class="pc-num">'+money(pendingAmt)+'</div><div class="pc-label">💰 Pendiente</div></div></div>'+
      (overdue.length?'<div class="pc-alert">🚨 <b>'+overdue.length+'</b> pago(s) vencido(s) · '+money(overdueAmt)+'</div>':
       todayN.length?'<div class="pc-alert">⚠️ Tienes <b>'+todayN.length+'</b> pago(s) que vencen hoy.</div>':
       '<div class="pc-ok">✅ No tienes pagos vencidos.</div>');
  }
  window.GlassNotesPaymentsCenterV25={render,kind};
  document.addEventListener("DOMContentLoaded",render);
  setInterval(render,60000);
})();
</script>

<script id="payment-overdue-v251">
(function(){
 function day(v){
  const m=String(v||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m)return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);d.setHours(0,0,0,0);return d;
 }
 function refresh(){
  if(!window.S||!Array.isArray(S.payments))return;
  const cards=document.querySelectorAll('[data-payment-id],.payment-card,.payments-card');
  cards.forEach(card=>{
   const id=card.getAttribute('data-payment-id');
   if(!id)return;
   const p=S.payments.find(x=>String(x.id)===String(id));
   if(!p||p.status==='paid'||p.paid===true||p.completed===true)return;

    card.classList.add('payment-overdue-v251');
   }
  });
 }
 window.GlassNotesOverdueV251={refresh};

<script id="glassnotes-v29-tools">
(function(){
  function getState(){
    if(!window.S)return null;
    return JSON.parse(JSON.stringify(window.S));
  }
  function downloadBackup(){
    const state=getState();
    if(!state){alert('No se pudo preparar el respaldo.');return}
    const payload={
      app:'Glass Notes',
      version:'2.9.0',
      exportedAt:new Date().toISOString(),
      state:state
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='GlassNotes-Respaldo-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function restoreFile(file){
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(){
      try{
        const payload=JSON.parse(reader.result);
        const incoming=payload&&payload.state?payload.state:payload;
        if(!incoming||typeof incoming!=='object')throw new Error('Formato inválido');
        if(!Array.isArray(incoming.notes)||!Array.isArray(incoming.tasks)||!Array.isArray(incoming.payments)){
          throw new Error('El respaldo no contiene la estructura de Glass Notes');
        }
        if(!confirm('¿Restaurar este respaldo? Los datos actuales serán reemplazados.'))return;
        S=incoming;
        if(typeof save==='function')save();
        location.reload();
      }catch(e){
        console.error(e);
        alert('No se pudo restaurar el respaldo.');
      }
    };
    reader.readAsText(file);
  }
  window.GlassNotesV29={downloadBackup,restoreFile};
})();
</script>

<script id="glassnotes-v29-search">
(function(){
  window.GlassNotesSearchV29=function(query){
    const q=String(query||'').trim().toLowerCase();
    if(!window.S||!q)return [];
    const out=[];
    (S.notes||[]).forEach(n=>{
      const text=(String(n.title||'')+' '+String(n.body||n.text||'')).toLowerCase();
      if(text.includes(q))out.push({type:'Nota',id:n.id,title:n.title||'Sin título'});
    });
    (S.tasks||[]).forEach(t=>{
      const text=(String(t.title||t.name||'')+' '+String(t.note||t.text||'')).toLowerCase();
      if(text.includes(q))out.push({type:'Pendiente',id:t.id,title:t.title||t.name||'Sin título'});
    });
    (S.payments||[]).forEach(p=>{
      const text=(String(p.title||p.name||'')+' '+String(p.note||'')).toLowerCase();
      if(text.includes(q))out.push({type:'Pago',id:p.id,title:p.title||p.name||'Sin título'});
    });
    return out;
  };
})();
</script>
