<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070910">
<title>Glass Notes V0.3</title>
<style>
:root{--accent:#66e3ff;--bg:#05070d;--text:#f5f8ff;--muted:#ffffff8c;--glass:rgba(255,255,255,.075)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}.app-bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 12% 8%,#173e59 0,transparent 30%),radial-gradient(circle at 90% 20%,#29174d 0,transparent 30%),linear-gradient(145deg,#03050a,#090d17 55%,#04060b)}
.app-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,rgba(102,227,255,.035),transparent 75%);pointer-events:none}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 55px rgba(0,0,0,.26),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.topbar{position:sticky;top:10px;z-index:8;margin:10px;border-radius:28px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--accent)}h1{font-size:20px;margin:4px 0}h2{margin:12px 0}p{line-height:1.45}.muted{color:var(--muted)}.small{font-size:12px}
.icon{border:0;color:#fff;background:#ffffff0b;width:43px;height:43px;border-radius:15px;font-size:19px}
.screen{padding:0 14px 190px}.hero{padding:20px;border-radius:28px;margin:12px 0}.hero .big{font-size:28px;font-weight:800}
.grid{display:grid;gap:12px}.note{position:relative;overflow:hidden;border-radius:27px;padding:19px;min-height:150px;cursor:pointer;transition:.2s transform}.note:active{transform:scale(.985)}.note .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35}.note>*:not(.bg){position:relative}.note h3{margin:0 0 7px;color:var(--accent)}.note p{margin:0;color:#ffffffb5;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.badge{display:inline-flex;margin-top:12px;font-size:11px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);padding:6px 9px;border-radius:999px}
.nav{position:fixed;left:10px;right:10px;bottom:10px;z-index:20;border-radius:27px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:max(7px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#ffffff88;padding:8px 2px;border-radius:19px;font-size:18px}.nav span{display:block;font-size:10px;margin-top:3px}.nav .active{background:#66e3ff1c;color:var(--accent)}
.fab{position:fixed;right:20px;bottom:98px;z-index:21;width:60px;height:60px;border:0;border-radius:21px;background:var(--accent);color:#041017;font-size:31px;box-shadow:0 0 34px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab-menu{position:fixed;right:20px;bottom:166px;z-index:21;display:grid;gap:8px;transform:scale(.9);opacity:0;pointer-events:none;transform-origin:bottom right;transition:.2s}.fab-menu.open{transform:scale(1);opacity:1;pointer-events:auto}.quick{border:1px solid #ffffff18;background:#101522ee;color:#fff;padding:11px 14px;border-radius:17px;text-align:left;min-width:190px;box-shadow:0 10px 35px #0007}
.modal{position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:flex-end}.hidden{display:none!important}.sheet{width:100%;max-height:90vh;overflow:auto;border-radius:30px 30px 0 0;padding:20px 18px 30px}.sheethead{display:flex;justify-content:space-between;align-items:center}.field{width:100%;border:1px solid #ffffff18;border-radius:16px;background:#050810b8;color:#fff;padding:13px 14px;outline:0;font:inherit}.field:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}textarea.field{resize:vertical}.label{font-size:12px;color:#ffffff8a;margin:13px 0 6px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.btn{border:1px solid #ffffff18;border-radius:15px;padding:11px 14px;background:#ffffff09;color:#fff;font-weight:700}.primary{background:var(--accent);color:#041017;border-color:transparent}.danger{color:#ff8d8d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.checkrow{display:grid;grid-template-columns:24px 1fr 42px;gap:8px;align-items:center;margin:8px 0}.checkrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.color{width:58px!important;padding:4px!important;height:45px}.empty{text-align:center;padding:28px;color:#ffffff80;border-radius:24px}.payment{padding:18px;border-radius:25px}.status{font-size:12px;color:#ffb45d}.ok{color:#6dffb2}
.jarvis{padding:22px;border-radius:29px}.orb{width:82px;height:82px;border-radius:50%;margin:4px auto 16px;background:radial-gradient(circle,#fff 0 5%,var(--accent) 12%,#14677b 35%,transparent 70%);box-shadow:0 0 40px color-mix(in srgb,var(--accent) 45%,transparent);animation:pulse 2.8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06);filter:brightness(1.2)}}
.preview{border-radius:23px;min-height:130px;padding:18px;background-size:cover;background-position:center;border:1px solid #ffffff15}.font-pill{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:#ffffff09;border:1px solid #ffffff15;font-size:11px}
@media(min-width:700px){.screen{max-width:720px;margin:auto}.nav{max-width:680px;margin:auto}.fab{right:max(20px,calc((100vw - 720px)/2 + 20px))}}
</style>
</head>
<body>
<div class="app-bg"></div>
<header class="topbar glass">
  <div><div class="eyebrow">GLASS NOTES</div><h1>Buenos días, señor.</h1><div class="muted small">Tu espacio personal</div></div>
  <button class="icon" id="settings">⚙️</button>
</header>
<main id="screen"></main>

<div class="fab-menu" id="fabMenu">
  <button class="quick" data-create="note">📝 <b>Nota</b><br><span class="muted small">Texto + personalización</span></button>
  <button class="quick" data-create="task">✅ <b>Lista</b><br><span class="muted small">Pendientes con checklist</span></button>
  <button class="quick" data-create="payment">💳 <b>Pago</b><br><span class="muted small">Fecha + recordatorio</span></button>
</div>
<button class="fab" id="fab">＋</button>

<nav class="nav glass">
  <button class="active" data-tab="notes">📝<span>Notas</span></button>
  <button data-tab="tasks">✅<span>Pendientes</span></button>
  <button data-tab="payments">💳<span>Pagos</span></button>
  <button data-tab="jarvis">🤖<span>JARVIS</span></button>
</nav>

<div class="modal hidden" id="modal"><div class="sheet glass"><div class="sheethead"><h2 id="mtitle">Nueva nota</h2><button class="icon" id="close">✕</button></div><div id="mbody"></div></div></div>

<script>
const KEY="glass_notes_v03";
let state=JSON.parse(localStorage.getItem(KEY)||'{"notes":[],"payments":[],"settings":{"fontName":"","fontData":"","accent":"#66e3ff","bgData":"","applyFontAll":true}}');
let tab="notes", editId=null, tempBg="";
const $=s=>document.querySelector(s);
const esc=s=>(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const days=ts=>Math.ceil((new Date(ts)-Date.now())/86400000);
const dateText=ts=>new Intl.DateTimeFormat("es-MX",{day:"2-digit",month:"long",year:"numeric"}).format(new Date(ts));
function fontStyle(){document.documentElement.style.setProperty("--accent",state.settings.accent||"#66e3ff");if(state.settings.fontData){let id="userFont";let old=$("#"+id);if(old)old.remove();let st=document.createElement("style");st.id=id;st.textContent="@font-face{font-family:'GlassUser';src:url("+state.settings.fontData+") format('truetype');font-display:swap}";document.head.appendChild(st);if(state.settings.applyFontAll)document.body.style.fontFamily="'GlassUser',system-ui,sans-serif";}}
function render(){fontStyle();if(tab==="notes")notes();if(tab==="tasks")tasks();if(tab==="payments")payments();if(tab==="jarvis")jarvis();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));}
function notes(){
let pending=state.notes.reduce((a,n)=>a+n.checks.filter(c=>!c.done).length,0);
$("#screen").innerHTML='<div class="screen"><section class="hero glass"><div class="big">🤖 '+(pending?pending+" pendientes":"Todo bajo control")+'</div><p class="muted">'+state.notes.length+" notas · "+state.payments.filter(p=>!p.paid).length+' pagos pendientes</p><span class="badge">Liquid Glass · V0.3</span></section><h2>Mis notas</h2><div class="grid">'+(state.notes.length?state.notes.map(noteCard).join(""):'<div class="glass empty">Crea tu primera nota con ＋</div>')+'</div></div>';
document.querySelectorAll("[data-note]").forEach(e=>e.onclick=()=>openNote(e.dataset.note));
}
function noteCard(n){
let p=n.checks.filter(c=>!c.done).length;
let bg=n.bg?`<div class="bg" style="background-image:url('${n.bg}')"></div>`:"";
return `<article class="note glass" data-note="${n.id}" style="--accent:${n.accent||state.settings.accent||"#66e3ff"}">${bg}<h3>${esc(n.title||"Sin título")}</h3><p>${esc(n.body||"Nota vacía")}</p>${n.checks.length?`<span class="badge">${n.checks.length-p}/${n.checks.length} completados</span>`:""}${n.fontName?`<div class="font-pill" style="margin-top:8px">🔤 ${esc(n.fontName)}</div>`:""}</article>`;
}
function tasks(){
let arr=[];state.notes.forEach(n=>n.checks.forEach(c=>arr.push({...c,nid:n.id,ntitle:n.title})));
$("#screen").innerHTML='<div class="screen"><h2>Pendientes</h2>'+(arr.length?'<div class="grid">'+arr.map(t=>`<div class="payment glass"><label class="checkrow"><input type="checkbox" ${t.done?"checked":""} data-task="${t.nid}|${t.id}"><span>${esc(t.text)}<small class="muted" style="display:block">${esc(t.ntitle||"Sin título")}</small></span><span></span></label></div>`).join("")+'</div>':'<div class="glass empty">No tienes pendientes todavía.</div>')+'</div>';
document.querySelectorAll("[data-task]").forEach(e=>e.onchange=()=>{let [nid,id]=e.dataset.task.split("|"),n=state.notes.find(x=>x.id===nid),c=n?.checks.find(x=>x.id===id);if(c)c.done=e.checked;save();render()});
}
function payments(){
$("#screen").innerHTML='<div class="screen"><div class="row between"><h2>Pagos</h2><button class="btn primary" id="np">＋ Nuevo</button></div>'+(state.payments.length?'<div class="grid">'+state.payments.map(paymentCard).join("")+'</div>':'<div class="glass empty">Tu agenda de pagos está vacía.<br><br>JARVIS podrá avisarte antes del vencimiento.</div>')+'</div>';
$("#np").onclick=()=>openPayment();
document.querySelectorAll("[data-paid]").forEach(e=>e.onclick=()=>{let p=state.payments.find(x=>x.id===e.dataset.paid);if(p){p.paid=!p.paid;save();render()}});
document.querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>{state.payments=state.payments.filter(p=>p.id!==e.dataset.del);save();render()});
}
function paymentCard(p){let d=days(p.due),s=p.paid?"✓ Pagado":d<0?"⚠ Vencido":d===0?"🔥 Vence hoy":d===1?"⏳ Vence mañana":`⏳ Faltan ${d} días`;return `<article class="payment glass"><div class="row between"><div><h3>${esc(p.title)}</h3><div class="muted small">${esc(p.amount||"")}</div></div><button class="btn" data-paid="${p.id}">${p.paid?"Desmarcar":"Pagado"}</button></div><p class="muted small">${dateText(p.due)}</p><div class="status ${p.paid?"ok":""}">${s}</div><div class="muted small">JARVIS: ${p.reminder} días antes</div><div class="actions"><button class="btn danger" data-del="${p.id}">Eliminar</button></div></article>`}
function jarvis(){
let up=state.payments.filter(p=>!p.paid).sort((a,b)=>new Date(a.due)-new Date(b.due)).slice(0,4);
let msg=up.length?`Señor, detecto ${up.length} pago${up.length>1?"s":""} próximo${up.length>1?"s":""}.`: "Señor, no detecto pagos pendientes.";
$("#screen").innerHTML='<div class="screen"><section class="jarvis glass"><div class="orb"></div><h2 style="text-align:center">JARVIS</h2><p style="text-align:center" class="muted">'+msg+'</p><hr style="border-color:#ffffff14">'+(up.length?up.map(p=>`<div class="payment glass" style="margin:10px 0"><b>${esc(p.title)}</b><div class="muted small">${dateText(p.due)} · ${esc(p.amount||"")}</div><div class="status">${days(p.due)<=2?"Atención próxima":"Programado"}</div></div>`).join(""):'<div class="empty">Todo tranquilo por ahora.</div>')+'</section></div>';
}
function openModal(title,body){$("#mtitle").textContent=title;$("#mbody").innerHTML=body;$("#modal").classList.remove("hidden");}
function closeModal(){$("#modal").classList.add("hidden");editId=null;tempBg=""}
$("#close").onclick=closeModal;

function openNote(id){
editId=id||null;let n=state.notes.find(x=>x.id===id)||{id:crypto.randomUUID(),title:"",body:"",checks:[],accent:state.settings.accent||"#66e3ff",bg:"",fontData:"",fontName:""};
tempBg=n.bg;
openModal(id?"Editar nota":"Nueva nota",`
<div class="label">Título</div><input class="field" id="nt" value="${esc(n.title)}" placeholder="Gas, supermercado, ideas...">
<div class="label">Contenido</div><textarea class="field" id="nb" rows="6" placeholder="Escribe aquí...">${esc(n.body)}</textarea>
<div class="label">Checklist</div><div id="cl">${n.checks.map((c,i)=>`<div class="checkrow"><input type="checkbox" data-ci="${i}" ${c.done?"checked":""}><input class="field" data-ct="${i}" value="${esc(c.text)}"><button class="icon" data-rm="${i}">🗑️</button></div>`).join("")}</div>
<div class="row"><input class="field" id="newc" placeholder="Nuevo pendiente"><button class="btn" id="addc">＋</button></div>
<div class="label">Personalización de esta nota</div>
<div class="row"><input type="color" class="field color" id="nc" value="${n.accent||"#66e3ff"}"><button class="btn" id="nbg">🖼️ Fondo</button><button class="btn" id="nfont">🔤 Fuente</button></div>
<div class="preview" id="preview" style="${tempBg?`background-image:url('${tempBg}')`:''};margin-top:12px"><b>Vista previa</b><p class="muted">Así se verá tu nota.</p></div>
<div class="actions"><button class="btn primary" id="saveN">Guardar</button>${id?'<button class="btn danger" id="delN">Eliminar</button>':""}<button class="btn" id="cancel">Cancelar</button></div>
<input hidden type="file" id="bgfile" accept="image/*"><input hidden type="file" id="fontfile" accept=".ttf,.otf,.woff,.woff2">
`);
$("#addc").onclick=()=>{let v=$("#newc").value.trim();if(!v)return;n.checks.push({id:crypto.randomUUID(),text:v,done:false});openNote(n.id)};
$("#nbg").onclick=()=>$("#bgfile").click();
$("#nfont").onclick=()=>$("#fontfile").click();
$("#bgfile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$("#preview").style.backgroundImage=`url('${r.result}')`;tempBg=r.result};r.readAsDataURL(f)};
$("#fontfile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{n.fontData=r.result;n.fontName=f.name;$("#nfont").textContent="🔤 "+f.name};r.readAsDataURL(f)};
$("#addc").onclick=()=>{};
$("#saveN").onclick=()=>{n.title=$("#nt").value.trim()||"Sin título";n.body=$("#nb").value;n.accent=$("#nc").value;n.bg=tempBg;n.fontData=n.fontData||"";n.fontName=n.fontName||"";n.checks.forEach((c,i)=>{let cb=document.querySelector(`[data-ci="${i}"]`),tx=document.querySelector(`[data-ct="${i}"]`);if(cb)c.done=cb.checked;if(tx)c.text=tx.value});if(!id)state.notes.unshift(n);save();closeModal();render()};
if(id)$("#delN").onclick=()=>{state.notes=state.notes.filter(x=>x.id!==id);save();closeModal();render()};
$("#cancel").onclick=closeModal;
document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{n.checks.splice(+b.dataset.rm,1);openNote(n.id)});
}

function openPayment(){
let n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());let iso=n.toISOString().slice(0,16);
openModal("Nuevo pago",`
<div class="label">Concepto</div><input class="field" id="pt" placeholder="Pago del gas">
<div class="label">Monto (opcional)</div><input class="field" id="pa" placeholder="$350">
<div class="label">Fecha y hora de vencimiento</div><input class="field" id="pd" type="datetime-local" value="${iso}">
<div class="label">Avisarme</div><select class="field" id="pr"><option value="0">Al vencer</option><option value="1">1 día antes</option><option value="2" selected>2 días antes</option><option value="3">3 días antes</option><option value="7">7 días antes</option></select>
<div class="actions"><button class="btn primary" id="saveP">Guardar pago</button><button class="btn" id="cancelP">Cancelar</button></div>`);
$("#saveP").onclick=()=>{let title=$("#pt").value.trim();if(!title)return alert("Escribe el concepto del pago.");let due=new Date($("#pd").value).getTime();if(!due)return alert("Selecciona una fecha.");state.payments.push({id:crypto.randomUUID(),title,amount:$("#pa").value.trim(),due,reminder:+$("#pr").value,paid:false});save();closeModal();render();};
$("#cancelP").onclick=closeModal;
}

function settings(){
openModal("Personalización",`
<p class="muted small">Puedes usar una fuente descargada de Google Fonts como fuente global. La fuente de cada nota puede ser distinta.</p>
<div class="label">Color principal</div><div class="row"><input type="color" class="field color" id="ga" value="${state.settings.accent||"#66e3ff"}"><span class="muted small">Se aplica a toda la interfaz.</span></div>
<div class="label">Fuente global</div><button class="btn" id="gf">🔤 ${state.settings.fontName||"Subir TTF / OTF / WOFF"}</button>
<div class="actions"><button class="btn primary" id="saveS">Guardar configuración</button><button class="btn" id="closeS">Cerrar</button></div>
<input hidden type="file" id="gff" accept=".ttf,.otf,.woff,.woff2">
`);
$("#gf").onclick=()=>$("#gff").click();
$("#gff").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state.settings.fontData=r.result;state.settings.fontName=f.name;$("#gf").textContent="🔤 "+f.name};r.readAsDataURL(f)};
$("#saveS").onclick=()=>{state.settings.accent=$("#ga").value;state.settings.applyFontAll=true;save();closeModal();render()};
$("#closeS").onclick=closeModal;
}
$("#settings").onclick=settings;

$("#fab").onclick=()=>{$("#fabMenu").classList.toggle("open");$("#fab").textContent=$("#fabMenu").classList.contains("open")?"×":"＋"};
document.querySelectorAll("[data-create]").forEach(b=>b.onclick=()=>{ $("#fabMenu").classList.remove("open");$("#fab").textContent="＋";if(b.dataset.create==="payment")openPayment();else openNote()});
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
render();
</script>
</body>
</html>
